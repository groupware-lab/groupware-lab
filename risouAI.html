<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>稟議書 申請画面</title>
    <style>
        /* ページ全体の基本設定（隙間をゼロにして画面いっぱいに） */
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 15px;
            background-color: #f5f5f5;
            box-sizing: border-box;
            height: 100vh; /* 画面の縦幅ぴったりに固定 */
            display: flex;
            flex-direction: column;
        }

        /* 稟議書の白い紙の部分（横も縦も画面に合わせる） */
        .form-container {
            width: 100%;             /* ★横幅いっぱいに広げる */
            flex: 1;                 /* ★縦幅を画面の下までいっぱいに広げる */
            background-color: #fff;
            padding: 20px 30px;
            box-sizing: border-box;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
        }

        /* タイトル「稟議書」 */
        .title {
            text-align: center;
            font-weight: bold;
            font-size: 24px;
            letter-spacing: 15px;
            margin-bottom: 15px;
        }

        /* テーブル（格子）を画面にフィットさせる */
        table {
            width: 100%;
            border-collapse: collapse;
            flex: 1;                 /* ★テーブル全体で画面の縦幅を埋める */
            display: flex;
            flex-direction: column;
        }

        tbody {
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        tr {
            display: flex;
            flex: 1;                 /* ★各行が縦に均等に広がる */
        }

        /* 格子の線とセル（マス）の設定 */
        th, td {
            border: 1px solid #333;
            padding: 8px;
            display: flex;
            align-items: center;    /* 中の文字を上下中央に */
            box-sizing: border-box;
        }

        /* 横幅の比率を％で指定して横いっぱいに広げる */
        .w-10  { width: 10%; }
        .w-15  { width: 15%; }
        .w-20  { width: 20%; }
        .w-23  { width: 23.33%; }
        .w-35  { width: 35%; }
        .w-40  { width: 40%; }
        .w-70  { width: 70%; }
        .w-85  { width: 85%; }
        .w-100 { width: 100%; }

        /* グレーの見出し部分 */
        th {
            background-color: #f9f9f9;
            font-weight: normal;
        }

        /* 入力欄をセルいっぱいに広げる */
        input[type="text"], textarea {
            width: 100%;
            height: 100%;            /* 縦幅いっぱい */
            box-sizing: border-box;
            border: none;
            outline: none;
            font-size: 16px;
        }

        /* 稟議内容の行は特に縦に広くする */
        .content-row {
            flex: 4;                 /* ★他の行より4倍広くする */
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 15px;
            width: 100%;
        }

        /* 一番下の承認者選択 */
        .approver-section {
            margin-top: 15px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 15px;
        }
    </style>
</head>
<body>

<div class="form-container">

    <!-- タイトル -->
    <div class="title">稟議書</div>

    <table>
        <tbody>
            <!-- 申請日 -->
            <tr>
                <th class="w-15">申請日</th>
                <td class="w-85" id="today-date" style="font-weight: bold;"></td>
            </tr>
            <!-- プロジェクト名 -->
            <tr>
                <th class="w-15">プロジェクト名</th>
                <td class="w-85"><input type="text" placeholder="プロジェクト名を入力"></td>
            </tr>
            <!-- 部署名・職位・申請者 -->
            <tr>
                <th class="w-15">部署名</th>
                <td class="w-23"><input type="text"></td>
                <th class="w-10">職位</th>
                <td class="w-23"><input type="text"></td>
                <th class="w-10">申請者</th>
                <td class="w-23"><input type="text"></td>
            </tr>
            <!-- 費用見積・実施希望日 -->
            <tr>
                <th class="w-15">費用見積</th>
                <td class="w-35"><input type="text" placeholder="￥"></td>
                <th class="w-15">実施希望日</th>
                <td class="w-35"><input type="text" placeholder="年　月　日"></td>
            </tr>
            <!-- 人数・委託先 -->
            <tr>
                <th class="w-15">人数</th>
                <td class="w-35"><input type="text" placeholder="人"></td>
                <th class="w-15">委託先</th>
                <td class="w-35">
                    <div class="checkbox-group">
                        <label><input type="radio" name="itaku"> あり（</label>
                        <input type="text" style="width: 100px; border-bottom: 1px solid #ccc; height: auto;"> ）
                        <label><input type="radio" name="itaku"> なし</label>
                    </div>
                </td>
            </tr>
            <!-- 稟議内容の見出し -->
            <tr>
                <th class="w-100">稟議内容（主旨・理由・目的および期待する効果等）</th>
            </tr>
            <!-- 稟議内容の入力欄（ここを一番広く） -->
            <tr class="content-row">
                <td class="w-100">
                    <textarea placeholder="ここに詳細を記入してください"></textarea>
                </td>
            </tr>
        </tbody>
    </table>

    <!-- 承認者の選択 -->
    <div class="approver-section">
        <span>承認者の選択:</span>
        <input type="text" style="border-bottom: 1px solid #333; width: 250px;" placeholder="承認者名を入力">
    </div>

</div>

<!-- 今日の日付を自動で入れるJavaScript -->
<script>
    const today = new Date();
    const year = today.getFullYear();
    const month = today.getMonth() + 1;
    const date = today.getDate();
    document.getElementById('today-date').textContent = year + '年' + month + '月' + date + '日';
</script>

</body>
</html>
