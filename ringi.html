<!DOCTYPE html>
<html lang="ja">
<head> 
    <meta charset="UTF-8"> 
    <title>稟議書 申請画面</title>
    <link rel="stylesheet" href="ringi.css">
</head>
<body>
<div class="form-container">
    <div class="title">稟議書</div>
    
    <table>
        <tbody>
            <tr>
                <th class="w-15">申請日</th>
                <td colspan="5" class="w-85" id="today-date" style="font-weight: bold;"></td>
            </tr>
            <tr>
                <th class="w-15">プロジェクト名</th>
                <td colspan="5" class="w-85"><input type="text" placeholder="プロジェクト名を入力"></td> 
            </tr>
            <tr>
                <th class="w-15">部署名</th>
                <td class="w-23">
                    <select name="department" id="department"></select>
                </td>
                <th class="w-10">職位</th>
                <td class="w-23">
                    <select name="position" id="position"></select>
                </td>
                <th class="w-10">申請者</th>
                <td class="w-23">
                    <select name="applicant" id="applicant"></select>
                </td>
            </tr>
            <tr>
                <th class="w-15">費用見積</th>
                <td colspan="2" class="w-35"><input type="number" placeholder="￥">：円</td>
                <th class="w-15">実施希望日</th>
                <td colspan="2" class="w-35">
                    <input type="date" name="target_date" id="target_date">
                </td>
            </tr>
            <tr>
                <th class="w-15">人数</th>
                <td colspan="2" class="w-35"><input type="text" placeholder="人"></td>
                <th class="w-15">委託先</th>
                <td colspan="2" class="w-35">
                    <div class="checkbox-group">
                        <label><input type="radio" name="itaku"> あり（</label>
                        <input type="text" class="inline-input"> ）
                        <label><input type="radio" name="itaku"> なし</label>
                    </div>
                </td>
            </tr>
            <tr>
                <th colspan="6" class="w-100">稟議内容（主旨・理由・目的および期待する効果等）</th>
            </tr>
            <tr class="content-row">
                <td colspan="6" class="w-100">
                    <textarea placeholder="ここに詳細を記入してください"></textarea>
                </td>
            </tr>
        </tbody>
    </table>

    <div class="approver-section" id="approver-section">
        <div class="approver-box">
            <div class="approver-block" id="approver-list">

                <div class="approver-row">
                    <span class="approver-label">申請者：</span>
                    <select name="positions[]" class="approver-input approver-position">
                        <!-- 職位（係長・課長・部長など） -->
                    </select>
                    <select name="approvers[]" class="approver-input approver-select">
                        <!-- 氏名（DBから承認者候補） -->
                    </select>
                    <button type="button" class="add-approver-btn">＋</button>
                </div>
            </div>
        </div>
    </div>

    <script>
    const today = new Date(); /* 今日の日付を取得 */
    const year = today.getFullYear();
    const month = today.getMonth() + 1;
    const date = today.getDate();
    document.getElementById('today-date').textContent = year + '年' + month + '月' + date + '日';

    document.getElementById('approver-list').addEventListener('click', function(e) {
        if (!e.target.classList.contains('add-approver-btn')) return;

        const rows = document.querySelectorAll('.approver-row');
        const approverNumber = rows.length; // 1行目(申請者)を除いた承認者の番号

        const newRow = rows[0].cloneNode(true);
        newRow.querySelector('.approver-label').textContent = '承認者' + approverNumber + ':';

        // select要素のname属性を承認者用の配列に変更
        const selects = newRow.querySelectorAll('select');
        selects[0].name = 'approver_positions[]';
        selects[1].name = 'approver_names[]';
        selects.forEach(sel => sel.selectedIndex = 0);

        const btn = newRow.querySelector('button');
        btn.textContent = '－';
        btn.classList.remove('add-approver-btn');
        btn.classList.add('remove-approver-btn');

        document.getElementById('approver-list').appendChild(newRow);
    });

    document.getElementById('approver-list').addEventListener('click', function(e) {
        if (e.target.classList.contains('remove-approver-btn')) {
            e.target.closest('.approver-row').remove();
        }
    });
</script>
</body>
</html>
