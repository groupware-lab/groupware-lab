    <script>
        // 1. 画面の時計を毎秒更新する処理
        function updateClock() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('ja-JP', { hour12: false });
            document.getElementById('live-clock').textContent = timeString;
        }
        
        setInterval(updateClock, 1000);
        updateClock();

        // 2. 打刻ボタンを押したときの処理
        function submitStamp(stampType) {
            const employeeId = document.getElementById('employee_id').value.trim();
            const messageDiv = document.getElementById('message');

            // バリデーション（未入力チェック）
            if (!employeeId) {
                showMessage('社員番号を入力してください。', 'danger');
                return;
            }

            // 現在時刻の取得
            const now = new Date();
            const currentTime = now.toLocaleTimeString('ja-JP', { hour12: false });

            // メッセージを表示
            showMessage(`【${stampType}】完了しました。<br><small>社員番号: ${employeeId} (${currentTime})</small>`, 'success');
        }

        // メッセージ表示共通関数
        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.innerHTML = text;
            messageDiv.className = `alert alert-${type} mt-4`;
        }
    </script>
